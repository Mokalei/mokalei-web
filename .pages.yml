# Configuration de l'éditeur Pages CMS (app.pagescms.org).
# Définit les formulaires que voit la personne qui met à jour le site.
media:
  input: src/media
  output: /media
content:
- name: photos
  label: 📷 Photos, vidéos et coordonnées
  type: file
  path: src/_data/site.json
  format: json
  fields:
  - name: contact
    label: Coordonnées
    type: object
    fields:
    - name: email
      label: Adresse email
      type: string
    - name: instagram
      label: Lien Instagram
      type: string
      description: Adresse complète, par exemple https://www.instagram.com/mokalei.moorea/
    - name: facebook
      label: Lien Facebook
      type: string
      description: Adresse complète de la page Facebook.
    - name: lien_airbnb
      label: Lien de l'annonce Airbnb
      type: string
      description: 'Laissez vide tant que l''annonce n''est pas publiée : le bouton Airbnb sera masqué.'
    - name: numero_enregistrement
      label: N° d'enregistrement (Service du Tourisme)
      type: string
      description: Format DTO-MT. Laissez vide pour le masquer.
  - name: logo
    label: Logo
    type: image
    description: Logo blanc sur fond noir.
  - name: video_accueil
    label: Vidéo d'accueil (en haut à droite)
    type: object
    fields:
    - name: video
      label: Vidéo (MP4)
      type: file
      description: Vidéo verticale (format téléphone), MP4, moins de 20 Mo. Elle se lance seule, sans le son, en boucle. Laissez vide pour la masquer.
      options:
        extensions:
        - mp4
    - name: image
      label: Image d'attente
      type: image
      description: Image affichée pendant le chargement de la vidéo.
    - name: description_fr
      label: Description de la vidéo (français)
      type: text
    - name: description_en
      label: Description de la vidéo (anglais)
      type: text
  - name: photo_accueil
    label: Grande photo d'accueil (sous le titre)
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
  - name: photos_histoire
    label: Photos « Notre histoire » (plaques des fare)
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
    description: 3 photos conseillées (une par fare).
    list: true
  - name: photos_sejour
    label: Photos « Le séjour » (chambres, cuisine…)
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
    description: 3 photos conseillées. Vous pouvez en ajouter, en retirer ou changer l'ordre.
    list: true
  - name: photos_interieur
    label: Photos et vidéos « Dans chaque fare » (salon, salle de bain, douche…)
    type: object
    fields:
    - name: video
      label: Vidéo (MP4)
      type: file
      description: Facultatif. Si une vidéo est choisie, elle remplace la photo (qui sert alors d'image d'attente). Format vertical, MP4, courte.
      options:
        extensions:
        - mp4
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
    description: 4 éléments conseillés, en format vertical.
    list: true
  - name: photo_vue
    label: Photo « La vue »
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
  - name: photos_soirees
    label: Photos « Les soirées »
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
    description: 3 photos conseillées, format portrait ou paysage.
    list: true
  - name: image_legende_1
    label: Image de la légende 1 (Hiro)
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
  - name: image_legende_2
    label: Image de la légende 2 (pieuvre)
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
      description: Une phrase qui décrit la photo. Lue par Google et par les personnes malvoyantes.
    - name: description_en
      label: Description de la photo (anglais)
      type: text
      description: La même phrase, en anglais.
  - name: image_legende_3
    label: Image de la légende 3 (māpē)
    type: object
    fields:
    - name: image
      label: Photo
      type: image
      description: Cliquez pour choisir ou téléverser une photo (format paysage conseillé, JPG).
    - name: description_fr
      label: Description de la photo (français)
      type: text
